name: 📢 Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-plan:
    name: 🤖 Plan release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan_release.outputs.release }}
      version: ${{ steps.plan_release.outputs.version }}
      tag: ${{ steps.plan_release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator
      - name: Plan release
        id: plan_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: 1
        run: |
          set -Eeuo pipefail

          previous_tag=$(git describe --tags --abbrev=0 \
            --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)

          npx semantic-release --dry-run 2>&1 | tee semantic-release.log
          version=$(awk '/The next release version is/ { print $NF }' semantic-release.log | tail -n1)

          if [[ -z "$version" ]]; then
            echo "release=False" >> "$GITHUB_OUTPUT"
            {
              echo "### No release planned"
              echo
              echo "No release-producing Conventional Commits were found since \`${previous_tag:-the beginning of history}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid semantic-release version: $version" >&2
              exit 1
            fi

            if [[ -n "$previous_tag" ]]; then
              commit_count=$(git rev-list --count "${previous_tag}..HEAD")
            else
              commit_count=$(git rev-list --count HEAD)
            fi

            echo "release=True" >> "$GITHUB_OUTPUT"
            printf 'version=%s\ntag=v%s\n' "$version" "$version" >> "$GITHUB_OUTPUT"
            {
              echo "### Release plan"
              echo
              echo "- Previous release: \`${previous_tag:-none}\`"
              echo "- Conventional Commits analyzed: \`$commit_count\`"
              echo "- Next release: \`v$version\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  linux-build:
    name: 🐧 linux build
    runs-on: ubuntu-latest
    needs: [release-plan]
    if: ${{ needs.release-plan.outputs.release == 'True' }}
    steps:
      - uses: actions/checkout@v6
      - name: apt install deps
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q --no-install-recommends \
            cmake ninja-build libopencv-dev libgavl-dev libfreetype-dev \
            libcairo2-dev libgl-dev libegl-dev
      - name: Build using cmake+ninja
        run: |
          mkdir build && cd build
          cmake -G "Ninja" -D FREI0R_VERSION=${{ needs.release-plan.outputs.version }} ../
          ninja
      - name: Test release build
        run: ctest --test-dir build --output-on-failure
      - name: Upload linux filter
        uses: actions/upload-artifact@v6
        with:
          name: release-linux-filter
          path: build/src/filter/**/*.so
      - name: Upload linux mixer2
        uses: actions/upload-artifact@v6
        with:
          name: release-linux-mixer2
          path: build/src/mixer2/**/*.so
      - name: Upload linux mixer3
        uses: actions/upload-artifact@v6
        with:
          name: release-linux-mixer3
          path: build/src/mixer3/**/*.so
      - name: Upload linux generator
        uses: actions/upload-artifact@v6
        with:
          name: release-linux-generator
          path: build/src/generator/**/*.so
      - name: Upload linux pkg-config
        uses: actions/upload-artifact@v6
        with:
          name: release-linux-pkgconfig
          path: build/frei0r.pc

  win-build:
    name: 🪟 win64 build
    runs-on: windows-latest
    needs: [release-plan]
    if: ${{ needs.release-plan.outputs.release == 'True' }}
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
      - name: choco install deps
        uses: crazy-max/ghaction-chocolatey@v3
        with:
          args: install libopencv-dev
      - name: Build using nmake
        run: |
          mkdir build && cd build
          cmake -G "NMake Makefiles" -D BUILD_TESTING=OFF -D WITHOUT_OPENCV=1 -D WITHOUT_CAIRO=1 -D WITHOUT_GAVL=1 -D FREI0R_VERSION=${{ needs.release-plan.outputs.version }} ../
          nmake
      - name: Upload win64 filter
        uses: actions/upload-artifact@v6
        with:
          name: release-win64-filter
          path: build/src/filter/**/*.dll
      - name: Upload win64 mixer2
        uses: actions/upload-artifact@v6
        with:
          name: release-win64-mixer2
          path: build/src/mixer2/**/*.dll
      - name: Upload win64 mixer3
        uses: actions/upload-artifact@v6
        with:
          name: release-win64-mixer3
          path: build/src/mixer3/**/*.dll
      - name: Upload win64 generator
        uses: actions/upload-artifact@v6
        with:
          name: release-win64-generator
          path: build/src/generator/**/*.dll
      - name: Upload win64 pkg-config
        uses: actions/upload-artifact@v6
        with:
          name: release-win64-pkgconfig
          path: build/frei0r.pc

  osx-build:
    name: 🍏 osx build
    runs-on: macos-latest
    needs: [release-plan]
    if: ${{ needs.release-plan.outputs.release == 'True' }}
    steps:
      - uses: actions/checkout@v6
      - name: Update Homebrew
        run: |
          brew update
      - name: Install Homebrew dependencies
        run: |
          env HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 \
          brew install ninja cairo
      - name: Build using ninja
        run: |
          mkdir build && cd build
          cmake -G "Ninja" -D WITHOUT_OPENCV=1 -D WITHOUT_GAVL=1 -D FREI0R_VERSION=${{ needs.release-plan.outputs.version }} ../
          ninja
      - name: Upload osx filter
        uses: actions/upload-artifact@v6
        with:
          name: release-osx-filter
          path: build/src/filter/**/*.so
      - name: Upload osx mixer2
        uses: actions/upload-artifact@v6
        with:
          name: release-osx-mixer2
          path: build/src/mixer2/**/*.so
      - name: Upload osx mixer3
        uses: actions/upload-artifact@v6
        with:
          name: release-osx-mixer3
          path: build/src/mixer3/**/*.so
      - name: Upload osx generator
        uses: actions/upload-artifact@v6
        with:
          name: release-osx-generator
          path: build/src/generator/**/*.so
      - name: Upload osx pkg-config
        uses: actions/upload-artifact@v6
        with:
          name: release-osx-pkgconfig
          path: build/frei0r.pc

  wasi-build:
    name: 🌐 WASI bundle
    runs-on: ubuntu-latest
    needs: [release-plan]
    if: ${{ needs.release-plan.outputs.release == 'True' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: wasi-sdk
        uses: bytecodealliance/setup-wasi-sdk-action@v1
        with:
          version: '29'
          install-path: ${{ runner.temp }}/wasi-sdk
      - name: Configure core bundle
        run: |
          cmake -S . -B build-wasi -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.wasi-sdk.outputs.wasi-sdk-path }}/share/cmake/wasi-sdk-p1.cmake" \
            -DFREI0R_VERSION=${{ needs.release-plan.outputs.version }} \
            -DFREI0R_BUILD_BUNDLE=ON \
            -DBUILD_TESTING=ON \
            -DWITHOUT_OPENCV=ON \
            -DWITHOUT_CAIRO=ON \
            -DWITHOUT_GAVL=ON
      - name: Build and test release outputs
        run: |
          cmake --build build-wasi --parallel 4 --target \
            frei0r-bundle bundle-registry-wasi bundle-wasi-consumer
          ctest --test-dir build-wasi --output-on-failure -R \
            '^(bundle-registry-wasi|bundle-wasi-consumer)$'
      - name: Package tested WASI bundle
        run: |
          .github/scripts/package-wasm-release.sh \
            wasi \
            "${{ needs.release-plan.outputs.version }}" \
            29 \
            build-wasi \
            release-wasi
      - name: Upload WASI release package
        uses: actions/upload-artifact@v6
        with:
          name: release-wasi-package
          path: release-wasi/*.tar.gz
          if-no-files-found: error

  emscripten-build:
    name: 🌐 Emscripten bundle
    runs-on: ubuntu-latest
    needs: [release-plan]
    if: ${{ needs.release-plan.outputs.release == 'True' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Set writable Emscripten cache
        run: echo "EM_CACHE=$RUNNER_TEMP/emscripten-cache" >> "$GITHUB_ENV"
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 4.0.1
          actions-cache-folder: emsdk-4.0.1
      - name: Configure core bundle
        run: |
          cmake -S . -B build-emscripten -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DFREI0R_VERSION=${{ needs.release-plan.outputs.version }} \
            -DFREI0R_BUILD_BUNDLE=ON \
            -DBUILD_TESTING=ON \
            -DWITHOUT_OPENCV=ON \
            -DWITHOUT_CAIRO=ON \
            -DWITHOUT_GAVL=ON
      - name: Build and test release outputs
        run: |
          cmake --build build-emscripten --parallel 4 --target \
            frei0r-bundle bundle-registry-emscripten bundle-emscripten-consumer
          ctest --test-dir build-emscripten --output-on-failure -R \
            '^(bundle-registry-emscripten|bundle-emscripten-consumer)$'
      - name: Package tested Emscripten bundle
        run: |
          .github/scripts/package-wasm-release.sh \
            emscripten \
            "${{ needs.release-plan.outputs.version }}" \
            4.0.1 \
            build-emscripten \
            release-emscripten
      - name: Upload Emscripten release package
        uses: actions/upload-artifact@v6
        with:
          name: release-emscripten-package
          path: release-emscripten/*.tar.gz
          if-no-files-found: error

  publish-release:
    name: 🚀 Publish release
    runs-on: ubuntu-latest
    needs: [release-plan, win-build, osx-build, linux-build]
    if: ${{ needs.release-plan.outputs.release == 'True' }}
    outputs:
      version: ${{ steps.publish_release.outputs.version }}
      tag: ${{ steps.publish_release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator
      - name: Publish release
        id: publish_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
        run: |
          set -Eeuo pipefail

          npx semantic-release

          tag_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          head_commit=$(git rev-parse HEAD)
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "$RELEASE_TAG does not point to the release commit" >&2
            exit 1
          fi

          printf 'version=%s\ntag=%s\n' \
            "$RELEASE_VERSION" \
            "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  publish-binary-release:
    name: 📦 Pack release
    needs:
      - release-plan
      - publish-release
      - win-build
      - osx-build
      - linux-build
      - wasi-build
      - emscripten-build
    if: ${{ needs.release-plan.outputs.release == 'True' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: download binary artifacts
        uses: actions/download-artifact@v7
        with:
          path: |
            frei0r-bin
      - name: create compressed archives
        run: |
          dst=frei0r-${{ needs.publish-release.outputs.version }}_win64
          mkdir -p $dst/filter $dst/generator $dst/mixer2 $dst/mixer3
          find frei0r-bin/release-win64-filter    -type f -name '*.dll' -exec cp {} $dst/filter    \;
          find frei0r-bin/release-win64-generator -type f -name '*.dll' -exec cp {} $dst/generator \;
          find frei0r-bin/release-win64-mixer2    -type f -name '*.dll' -exec cp {} $dst/mixer2    \;
          find frei0r-bin/release-win64-mixer3    -type f -name '*.dll' -exec cp {} $dst/mixer3    \;
          cp README.md $dst/README.txt
          cp COPYING   $dst/LICENSE.txt
          cp ChangeLog $dst/ChangeLog.txt
          cp AUTHORS.md   $dst/AUTHORS.txt
          cp include/frei0r.h include/frei0r.hpp $dst/
          cp frei0r-bin/release-win64-pkgconfig/frei0r.pc $dst/
          echo "${{ needs.publish-release.outputs.version }}" > $dst/VERSION.txt
          zip -r -9 $dst.zip $dst

          dst=frei0r-${{ needs.publish-release.outputs.version }}_osx
          mkdir -p $dst/filter $dst/generator $dst/mixer2 $dst/mixer3
          find frei0r-bin/release-osx-filter    -type f -name '*.so' -exec cp {} $dst/filter    \;
          find frei0r-bin/release-osx-generator -type f -name '*.so' -exec cp {} $dst/generator \;
          find frei0r-bin/release-osx-mixer2    -type f -name '*.so' -exec cp {} $dst/mixer2    \;
          find frei0r-bin/release-osx-mixer3    -type f -name '*.so' -exec cp {} $dst/mixer3    \;
          cp README.md $dst/README.txt
          cp COPYING   $dst/LICENSE.txt
          cp ChangeLog $dst/ChangeLog.txt
          cp AUTHORS.md   $dst/AUTHORS.txt
          cp include/frei0r.h include/frei0r.hpp $dst/
          cp frei0r-bin/release-osx-pkgconfig/frei0r.pc $dst/
          echo "${{ needs.publish-release.outputs.version }}" > $dst/VERSION.txt
          zip -r -9 $dst.zip $dst

          dst=frei0r-${{ needs.publish-release.outputs.version }}_linux
          mkdir -p $dst/filter $dst/generator $dst/mixer2 $dst/mixer3
          find frei0r-bin/release-linux-filter    -type f -name '*.so' -exec cp {} $dst/filter    \;
          find frei0r-bin/release-linux-generator -type f -name '*.so' -exec cp {} $dst/generator \;
          find frei0r-bin/release-linux-mixer2    -type f -name '*.so' -exec cp {} $dst/mixer2    \;
          find frei0r-bin/release-linux-mixer3    -type f -name '*.so' -exec cp {} $dst/mixer3    \;
          cp README.md $dst/README.txt
          cp COPYING   $dst/LICENSE.txt
          cp ChangeLog $dst/ChangeLog.txt
          cp AUTHORS.md   $dst/AUTHORS.txt
          cp include/frei0r.h include/frei0r.hpp $dst/
          cp frei0r-bin/release-linux-pkgconfig/frei0r.pc $dst/
          echo "${{ needs.publish-release.outputs.version }}" > $dst/VERSION.txt
          tar cvfz $dst.tar.gz $dst

          cp frei0r-bin/release-wasi-package/*.tar.gz .
          cp frei0r-bin/release-emscripten-package/*.tar.gz .

          sha256sum *.zip *.tar.gz > SHA256SUMS.txt

      - name: release all archives
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.tar.gz
            SHA256SUMS.txt
          tag_name: ${{ needs.publish-release.outputs.tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
