name: Website

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'include/**'
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'examples/browser-demo/runtime/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'include/**'
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'examples/browser-demo/runtime/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Set writable Emscripten cache
        run: echo "EM_CACHE=$RUNNER_TEMP/emscripten-demo-cache" >> "$GITHUB_ENV"

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 4.0.1
          actions-cache-folder: emsdk-4.0.1

      - name: Cache Emscripten demo compilation
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/emscripten-demo-cache
          key: >-
            emscripten-demo-${{ runner.os }}-4.0.1-${{
            hashFiles('CMakeLists.txt', 'cmake/**', 'include/**', 'src/**',
            'examples/browser-demo/runtime/**', 'docs/demo/**', 'docs/scripts/**',
            'docs/vite.demo.config.ts', 'docs/package-lock.json') }}

      - name: Configure browser demo runtime
        run: |
          cmake -S . -B build-website-demo -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DFREI0R_BUILD_BROWSER_DEMO_RUNTIME=ON \
            -DBUILD_TESTING=ON \
            -DWITHOUT_OPENCV=ON \
            -DWITHOUT_CAIRO=ON \
            -DWITHOUT_GAVL=ON

      - name: Build browser demo runtime
        run: cmake --build build-website-demo --parallel 4 --target frei0r-demo-browser-runtime

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends doxygen graphviz

      - name: Install website dependencies
        working-directory: docs
        run: npm ci

      - name: Build website and API reference
        working-directory: docs
        env:
          FREI0R_DEMO_RUNTIME_DIR: ${{ github.workspace }}/build-website-demo/examples/browser-demo/runtime
        run: npm run build

      - name: Check complete Pages artifact
        working-directory: docs
        env:
          BASE_PATH: /frei0r/
        run: npm run check

      - name: Install Chromium for demo smoke coverage
        working-directory: docs
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Run deterministic demo browser smoke coverage
        working-directory: docs
        env:
          DEMO_SMOKE_ARTIFACTS: ${{ runner.temp }}/demo-browser-smoke
        run: npm run demo:test:browser

      - name: Upload demo browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: demo-browser-smoke
          path: ${{ runner.temp }}/demo-browser-smoke
          if-no-files-found: warn

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
